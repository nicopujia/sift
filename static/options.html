<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sift options</title>
<style>
  body { font: 18px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #111; background: #fff; margin: 0; }
  main { max-width: 40em; margin: 0 auto; padding: 1.5em 1em 4em; }
  h1 { font-size: 1.6em; margin: .2em 0 .6em; }
  h2 { font-size: 1.2em; margin: 1.6em 0 .4em; }
  label { display: grid; gap: .25em; margin: .9em 0; font-weight: 600; }
  label.check { display: flex; gap: .55em; align-items: center; }
  input[type=text], input[type=password], input[type=url], input[type=number], textarea, select { font: inherit; font-weight: 400; padding: .5em .65em; border: 2px solid #555; border-radius: .45em; width: 100%; }
  input[type=checkbox] { width: 1.3em; height: 1.3em; accent-color: #111; }
  textarea { min-height: 6em; }
  .hint { font-weight: 400; font-size: .88em; color: #474747; }
  button { font: inherit; padding: .55em 1.1em; border: 2px solid #111; border-radius: .5em; background: #111; color: #fff; cursor: pointer; }
  :focus-visible { outline: 3px solid #111; outline-offset: 2px; box-shadow: 0 0 0 6px #ffbf47; }
  table { border-collapse: collapse; font-size: .9em; }
  th, td { padding: .35em .7em; border-bottom: 1px solid #d4d4d4; text-align: left; }
  #status { margin-left: .8em; color: #1d6b36; font-weight: 600; }
</style>
</head>
<body>
<main id="app"></main>
<script src="options.js"></script>
</body>
</html>
