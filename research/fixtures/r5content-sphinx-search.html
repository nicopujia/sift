<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search — Python 3 documentation (fixture)</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  .related { background: #eee; padding: 6px 12px; }
  .document { display: flex; }
  .documentwrapper { flex: 1; }
  .body { padding: 12px 24px; max-width: 900px; }
  .sphinxsidebar { width: 230px; padding: 12px; background: #f6f6f6; }
  ul.search { list-style: none; padding: 0; }
  ul.search li { margin: 10px 0; }
  ul.search li p.context { color: #555; margin: 4px 0 0 20px; font-size: 90%; }
  span.highlighted { background: #fbe54e; }
</style>
</head>
<body>
<!-- Round 5 content fixer, F501: a Sphinx search results page. Its entries carry
     different classes by kind (kind-index, kind-object, kind-text, kind-title),
     and the search box holds the query from the address (?q=glob). Sift must show
     the results as a list of items (title, link, snippet) and never shorten them. -->
<div class="related" role="navigation" aria-label="Related">
  <a href="#">Python</a> » <a href="#">3.14 Documentation</a> » Search
  <form class="inline-search" role="search" action="r5content-sphinx-search.html" method="get">
    <input type="search" name="q" id="q" aria-label="Quick search">
    <input type="submit" value="Go">
  </form>
</div>
<div class="document">
  <div class="documentwrapper">
    <div class="bodywrapper">
      <div class="body" role="main">
        <h1 id="search-documentation">Search</h1>
        <p>Searching for multiple words only shows matches that contain all words.</p>
        <div id="search-results"></div>
      </div>
    </div>
  </div>
  <div class="sphinxsidebar" role="navigation" aria-label="Main">
    <h3>Navigation</h3>
    <ul><li><a href="#">Index</a></li><li><a href="#">Modules</a></li><li><a href="#">Glossary</a></li></ul>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search).get("q") || "glob";
  document.getElementById("q").value = q;
  const hl = (s) => s.replace(new RegExp(q, "gi"), (m) => `<span class="highlighted">${m}</span>`);
  const entries = [
    ["kind-index", "7. Simple statements", "reference/simple_stmts.html#index-46", 'global_stmt: "global" identifier ("," identifier)*'],
    ["kind-object", "glob", "library/glob.html#module-glob", null, "(Python module, in glob — Unix style pathname pattern expansion)"],
    ["kind-object", "glob.glob", "library/glob.html#glob.glob", null, "(Python function, in glob — Unix style pathname pattern expansion)"],
    ["kind-object", "glob.iglob", "library/glob.html#glob.iglob", null, "(Python function, in glob — Unix style pathname pattern expansion)"],
    ["kind-object", "pathlib.Path.glob", "library/pathlib.html#pathlib.Path.glob", null, "(Python method, in pathlib — Object-oriented filesystem paths)"],
    ["kind-object", "pathlib.Path.rglob", "library/pathlib.html#pathlib.Path.rglob", null, "(Python method, in pathlib — Object-oriented filesystem paths)"],
    ["kind-title", "glob — Unix style pathname pattern expansion", "library/glob.html", "The glob module finds all the pathnames matching a specified pattern according to the rules used by the Unix shell, although results are returned in arbitrary order."],
    ["kind-text", "pathlib — Object-oriented filesystem paths", "library/pathlib.html", "...Listing Python source files in this directory tree: >>> list(p.glob('**/*.py')) [PosixPath('test_pathlib.py'), PosixPath('setup.py'), PosixPath('pathlib.py')]..."],
    ["kind-text", "What’s New In Python 3.10", "whatsnew/3.10.html", "...instead of looking into __globals__['__builtins__']. The attribute is initialized from __globals__[\"__builtins__\"] if it exists..."],
    ["kind-text", "What’s New In Python 3.13", "whatsnew/3.13.html", "...PEP 703: CPython 3.13 has experimental support for running with the global interpreter lock disabled. See Free-threaded CPython for more details..."],
    ["kind-text", "fnmatch — Unix filename pattern matching", "library/fnmatch.html", "Note that the filename separator ('/' on Unix) is not special to this module. See module glob for pathname expansion (glob uses filter() to match pathname segments)."],
    ["kind-text", "Built-in Functions", "library/functions.html", "...globals() Return the dictionary implementing the current module namespace. For code within functions, this is set when the function is defined and remains the same..."],
    ["kind-text", "The Python Tutorial: Classes", "tutorial/classes.html", "...the global statement can be used to indicate that particular variables live in the global scope and should be rebound there; the nonlocal statement..."],
    ["kind-text", "Execution model", "reference/executionmodel.html", "...If the global statement occurs within a block, all uses of the names specified in the statement refer to the bindings of those names in the top-level namespace..."],
  ];
  const box = document.getElementById("search-results");
  box.innerHTML = `<h2>Search Results</h2><p class="search-summary">Search finished, found ${entries.length} pages matching the search query.</p>`;
  const ul = document.createElement("ul");
  ul.className = "search";
  ul.setAttribute("role", "list");
  for (const [kind, title, href, context, desc] of entries) {
    const li = document.createElement("li");
    li.className = kind;
    li.innerHTML = `<a href="${href}">${hl(title)}</a>` + (desc ? `<span> ${desc.replace(/\bin (\w+)/, (m, w) => `in <code class="xref py py-mod docutils literal notranslate"><span class="pre">${hl(w)}</span></code>`)}</span>` : "") + (context ? `<p class="context">${hl(context)}</p>` : "");
    ul.appendChild(li);
  }
  box.appendChild(ul);
</script>
</body>
</html>
