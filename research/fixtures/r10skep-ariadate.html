<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a table - real React Aria DateField</title>
<style>body { font-family: sans-serif; margin: 24px; max-width: 40em; } .react-aria-DateInput { display: inline-flex; border: 1px solid #888; padding: 4px; } .react-aria-DateSegment { padding: 0 2px; }</style>
</head>
<body>
<main>
  <h1>Book a table</h1>
  <p>Pick the day you want to come. We hold tables for fifteen minutes after the booked time, and we seat walk-ins at the bar.</p>
  <div id="app">loading</div>
  <p id="out" role="status"></p>
</main>
<script type="module">
  import React from "https://esm.sh/react@18.3.1";
  import { createRoot } from "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1";
  import { DateField, Label, DateInput, DateSegment, Button } from "https://esm.sh/react-aria-components@1.4.0?deps=react@18.3.1,react-dom@18.3.1";
  const h = React.createElement;
  window.__log = [];
  function App() {
    const [v, setV] = React.useState(null);
    return h("div", null,
      h(DateField, { value: v, onChange: (x) => { setV(x); window.__val = x ? x.toString() : null; window.__log.push("change " + (x ? x.toString() : "null")); } },
        h(Label, null, "Reservation date"),
        h(DateInput, null, (seg) => h(DateSegment, { segment: seg }))),
      h(Button, { onPress: () => { document.getElementById("out").textContent = "Booked for " + (v ? v.toString() : "?"); window.__log.push("book"); } }, "Book"));
  }
  createRoot(document.getElementById("app")).render(h(App));
  window.__ready = true;
</script>
</body>
</html>
