<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Bikes for sale</title></head>
<body><main><h1>Bikes for sale</h1>
<div id="top"></div>
<div id="box"></div>
<p>Results show below. Craigslist-like: the first keystroke adds a clear link and redraws the filter form with new nodes.</p>
</main>
<script>
window.__log = [];
const box = document.getElementById("box"), top_ = document.getElementById("top");
let min = "", max = "";
function draw() {
  box.innerHTML = `<form onsubmit="event.preventDefault()"><label for="min">Min price</label><input id="min" name="min" value="${min}"><label for="max">Max price</label><input id="max" name="max" value="${max}"><button type="submit">Apply</button></form>`;
  for (const id of ["min", "max"]) document.getElementById(id).addEventListener("input", (e) => {
    if (id === "min") min = e.target.value; else max = e.target.value;
    __log.push(id + "=" + e.target.value);
    setTimeout(() => { top_.innerHTML = '<p><a href="#" onclick="return false">clear</a> 1 filter on</p>'; draw(); }, 50);
  });
}
draw();
</script></body></html>
