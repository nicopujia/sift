<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Trail runner - ShoeCo</title>
<style>.swiper-wrapper{display:flex;gap:8px}.swiper-slide button{width:48px;height:40px}</style></head><body>
<header><a href="/">ShoeCo</a></header>
<main>
<h1>Trail runner</h1>
<p>$120.00</p>
<div class="size-picker"><h2>Select size</h2>
<div class="swiper sizes-swiper"><div class="swiper-wrapper">
<div class="swiper-slide"><button type="button" onclick="document.getElementById('s').textContent='8'">8</button></div>
<div class="swiper-slide"><button type="button" onclick="document.getElementById('s').textContent='9'">9</button></div>
<div class="swiper-slide"><button type="button" onclick="document.getElementById('s').textContent='10'">10</button></div>
<div class="swiper-slide"><button type="button" onclick="document.getElementById('s').textContent='11'">11</button></div>
</div></div>
<p>Size: <span id="s">none</span></p></div>
<button type="button">Add to cart</button>
<h2>Videos</h2>
<div class="slick-slider slick-initialized"><div class="slick-list"><div class="slick-track"><div class="slick-slide slick-active"><a href="/v/1">First video about trail running in the rain</a></div><div class="slick-slide"><a href="/v/2">Second video about lacing for long runs</a></div></div></div><ul><li class="slick-active"><button type="button">1</button></li><li><button type="button">2</button></li><li><button type="button">3</button></li></ul></div>
<div class="qty-slider"><span>Quantity</span> <button type="button">1</button><button type="button">2</button></div>
</main></body></html>
