<!doctype html>
<!-- SYNTHETIC stand-in using Amazon's long-standing cart ids. Not a real Amazon page. -->
<html lang="en-us"><head><meta charset="utf-8"><title>Amazon.com Shopping Cart</title>
<meta name="sift-test-url" content="https://www.amazon.com/gp/cart/view.html"></head><body>
<a id="nav-cart" href="/cart"><span id="nav-cart-count">3</span> Cart</a>
<div id="sc-active-cart"><h1>Shopping Cart</h1><div data-name="Active Items">
<div class="sc-list-item" data-asin="B000TEST01" data-itemid="i1"><img class="sc-product-image" src="https://example.com/a.jpg" width="100" height="100">
<a class="sc-product-link" href="/dp/B000TEST01"><span class="sc-product-title"><span class="a-truncate-full">soundcore by Anker Q20i Hybrid Active Noise Cancelling Headphones</span></span></a>
<span class="sc-product-price">$39.97</span><span class="sc-product-availability">In Stock</span>
<span data-a-selector="decrement"><button aria-label="Decrease quantity by one">−</button></span><span data-a-selector="value">2</span><span data-a-selector="increment"><button aria-label="Increase quantity by one">+</button></span>
<span data-action="delete"><input type="submit" value="Delete"></span><span data-action="save-for-later"><input type="submit" value="Save for later"></span></div>
<div class="sc-list-item" data-asin="B000TEST02" data-itemid="i2"><a class="sc-product-link" href="/dp/B000TEST02"><span class="sc-product-title"><span class="a-truncate-full">Gluten-free sourdough starter, 2 oz</span></span></a>
<span class="sc-product-price">$12.99</span><span data-a-selector="decrement"><button aria-label="Decrease quantity by one">−</button></span><span data-a-selector="value">1</span><span data-a-selector="increment"><button aria-label="Increase quantity by one">+</button></span>
<span data-action="delete"><input type="submit" value="Delete"></span></div>
</div><span id="sc-subtotal-label-activecart">Subtotal (3 items):</span><span id="sc-subtotal-amount-activecart">$92.93</span></div>
<div id="sc-buy-box-ptc-button"><input name="proceedToRetailCheckout" type="submit" value="Proceed to checkout"></div>
<script>
const total=()=>{let n=0,s=0;document.querySelectorAll('.sc-list-item').forEach(li=>{const q=+li.querySelector('[data-a-selector=value]').textContent;const p=+li.querySelector('.sc-product-price').textContent.slice(1);n+=q;s+=q*p});document.getElementById('sc-subtotal-label-activecart').textContent=`Subtotal (${n} items):`;document.getElementById('sc-subtotal-amount-activecart').textContent='$'+s.toFixed(2)};
document.querySelectorAll('.sc-list-item').forEach(li=>{const v=li.querySelector('[data-a-selector=value]');
li.querySelector('[data-a-selector=increment] button').onclick=()=>{v.textContent=+v.textContent+1;total()};
li.querySelector('[data-a-selector=decrement] button').onclick=()=>{v.textContent=Math.max(1,+v.textContent-1);total()};
li.querySelector('[data-action=delete] input').onclick=()=>{li.remove();total()}});
document.querySelector('[name=proceedToRetailCheckout]').onclick=()=>{window.__checkout=true};
</script></body></html>
