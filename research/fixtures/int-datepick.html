<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Book a table</title></head>
<body><main><h1>Book a table</h1><p>Pick a day for your booking. The calendar opens when you click the date field, like most booking sites.</p>
<form id="f" onsubmit="event.preventDefault();__log.push('book '+day.value)" style="position:relative">
<label for="day">Day</label> <input id="day" name="day" readonly placeholder="Choose a day">
<div id="cal" role="dialog" aria-label="Choose a day" hidden style="position:absolute;top:30px;left:0;background:#fff;border:1px solid #888;padding:8px;width:300px">
<button type="button" data-d="Mon 3">Mon 3</button> <button type="button" data-d="Tue 4">Tue 4</button> <button type="button" data-d="Wed 5">Wed 5</button>
</div>
<p><label for="ppl">People</label> <input id="ppl" name="ppl" type="number" value="2"></p>
<button>Book</button>
</form></main>
<script>window.__log = [];
const open = () => { cal.hidden = false; __log.push("calendar opened"); };
day.addEventListener("focus", open); day.addEventListener("click", open);
cal.addEventListener("click", (e) => { const d = e.target.dataset.d; if (d) { day.value = d; cal.hidden = true; __log.push("picked " + d); } });
</script></body></html>
