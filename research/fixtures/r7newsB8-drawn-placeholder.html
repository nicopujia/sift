<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Drawn placeholder</title>
<style>
.box { position: relative; width: 400px; border: 1px solid #888; padding: 8px; }
.box input { width: 100%; border: 0; font: 16px sans-serif; background: transparent; position: relative; z-index: 1; }
.box .q-placeholder { position: absolute; left: 8px; top: 8px; color: #888; font: 16px sans-serif; pointer-events: none; }
</style></head>
<body>
<main>
  <h1>Questions about your order</h1>
  <p>Type a question and our team answers within a day. This page holds a field whose only name is a placeholder the page draws over it (F732).</p>
  <div class="box"><input type="text" class="q-input"><div class="q-placeholder">Ask us about your order</div></div>
  <button type="button">Send</button>
</main>
</body>
</html>
