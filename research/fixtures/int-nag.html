<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Forum home</title></head>
<body>
<main><h1 id="h">Forum home</h1><p id="t">Welcome to the forum. Here people talk about gardening, cooking and local events, and anyone can read every thread.</p>
<p><a id="go" href="/nag.html?page=2">Gardening threads</a></p></main>
<div role="dialog" aria-modal="true" aria-label="Join the forum" style="position:fixed;left:30%;top:20%;width:40%;height:240px;background:#fff;border:1px solid #888;padding:12px">
<h2>Join the forum</h2><p>Create a free account to post and to follow threads you like.</p>
<button onclick="__log.push('signup')">Sign up</button> <a href="#" onclick="event.preventDefault();__log.push('later')">Maybe later</a>
</div>
<script>window.__log = [];
document.getElementById("go").addEventListener("click", (e) => { e.preventDefault(); history.pushState(null, "", "/nag.html?page=2"); h.textContent = "Gardening"; t.textContent = "Threads about gardening: tomatoes, roses, compost, and what to plant in autumn in a small balcony garden."; e.target.remove(); });
</script></body></html>
