<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route - Mode fixture</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  [role=radio][aria-checked=true] { font-weight: bold; }
</style>
</head>
<body>
<!-- F960: a travel mode choice writes the address (pushState), the page rebuilds its mode buttons
     (new elements, same names), and then focuses what was the active element before (Sift's root),
     as Google Maps does. Focus must stay on Sift's chosen radio, never jump to main.
     ?keep=1 keeps the same button elements (only aria-checked changes). -->
<main>
  <h1 id="title">Ferry Building to Coit Tower</h1>
  <div id="modes" role="radiogroup" aria-label="Travel modes"></div>
  <label>Sort <select id="sort"><option value="fast">Fastest</option><option value="short">Shortest</option><option value="cheap">Cheapest</option></select></label>
  <section id="route"></section>
</main>
<script>
  const MODES = [["drive", "Driving 9 min"], ["transit", "Transit 17 min"], ["walk", "Walking 24 min"], ["bike", "Cycling 15 min"]];
  const keep = new URLSearchParams(location.search).get("keep") === "1";
  const state = () => { const q = new URLSearchParams(location.search); return { mode: q.get("mode") || "walk", sort: q.get("sort") || "fast" }; };
  function render() {
    const s = state();
    const modes = document.getElementById("modes");
    if (!keep || !modes.children.length) {
      modes.textContent = "";
      for (const [id, label] of MODES) {
        const b = document.createElement("button");
        b.setAttribute("role", "radio");
        b.dataset.mode = id;
        b.setAttribute("aria-label", label);
        b.textContent = label;
        b.onclick = () => go({ mode: id });
        modes.append(b);
      }
    }
    for (const b of modes.children) b.setAttribute("aria-checked", String(b.dataset.mode === s.mode));
    document.getElementById("sort").value = s.sort;
    document.getElementById("route").innerHTML = `<h2>Route by ${s.mode}</h2><p>Sorted by ${s.sort}. Head toward the bay, then up the hill to Coit Tower. This text changes with the mode: ${s.mode} ${Date.now() % 1000}.</p>`;
  }
  function go(change) {
    const prev = document.activeElement;
    setTimeout(() => {
      const q = new URLSearchParams(location.search);
      for (const [k, v] of Object.entries(change)) q.set(k, v);
      history.pushState({}, "", "?" + q.toString());
      render();
      setTimeout(() => prev && prev.focus && prev.focus(), 150);
    }, 300);
  }
  document.getElementById("sort").addEventListener("change", (e) => go({ sort: e.target.value }));
  render();
</script>
</body>
</html>
