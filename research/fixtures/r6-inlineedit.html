<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Addresses · Breadbox</title>
<style>
body{font-family:system-ui;margin:0}
header{background:#3b2f63;color:#fff;padding:12px 24px}header a{color:#fff;margin-right:12px}
main{max-width:720px;margin:24px auto}
ul{list-style:none;padding:0}li{border-bottom:1px solid #ddd;padding:10px 0;display:flex;gap:12px;align-items:center}
li .t{flex:1}
li input{padding:4px}
.def{font-size:12px;background:#e6f4ea;padding:2px 6px;border-radius:8px}
</style></head>
<body>
<header><a href="/">Breadbox</a><a href="/account">Account</a></header>
<main>
<h1>Delivery addresses</h1>
<ul id="list"></ul>
<p><label for="when">Deliver on</label> <input type="date" id="when" min="2026-10-27" max="2026-11-30"> <span id="day"></span></p>
<p id="status" role="status"></p>
</main>
<script>
window.__log = [];
const $ = (id) => document.getElementById(id);
const data = [{ n: "Home", a: "1 Market St, San Francisco", d: true }, { n: "Work", a: "500 Howard St, San Francisco", d: false }, { n: "Mum", a: "22 Elm Ave, Oakland", d: false }];
let editing = -1;
function draw() {
  $("list").innerHTML = data.map((r, i) => i === editing
    ? '<li data-i="' + i + '"><span class="t"><label>Name <input class="en" value="' + r.n + '"></label> <label>Address <input class="ea" value="' + r.a + '" size="28"></label></span><button type="button" class="save">Save</button><button type="button" class="cancel">Cancel</button></li>'
    : '<li data-i="' + i + '"><span class="t"><strong>' + r.n + '</strong> ' + r.a + (r.d ? ' <span class="def">Default</span>' : "") + '</span><button type="button" class="edit" aria-label="Edit ' + r.n + '">Edit</button>' + (r.d ? "" : '<button type="button" class="mkdef" aria-label="Make ' + r.n + ' the default">Make default</button>') + "</li>").join("");
  if (editing >= 0) { const i = document.querySelector("li[data-i='" + editing + "'] .en"); i.focus(); i.select(); }
}
draw();
$("list").addEventListener("click", (e) => {
  const li = e.target.closest("li"); if (!li) return; const i = +li.dataset.i;
  if (e.target.closest(".edit")) { editing = i; __log.push("edit " + data[i].n); draw(); }
  else if (e.target.closest(".cancel")) { __log.push("cancel"); editing = -1; draw(); document.querySelector("li[data-i='" + i + "'] .edit").focus(); }
  else if (e.target.closest(".save")) { data[i].n = li.querySelector(".en").value; data[i].a = li.querySelector(".ea").value; __log.push("save " + data[i].n + " | " + data[i].a); editing = -1; draw(); $("status").textContent = "Saved " + data[i].n + "."; document.querySelector("li[data-i='" + i + "'] .edit").focus(); }
  else if (e.target.closest(".mkdef")) { data.forEach((r, j) => r.d = j === i); __log.push("default " + data[i].n); draw(); $("status").textContent = data[i].n + " is now your default address."; }
});
$("list").addEventListener("keydown", (e) => {
  if (editing < 0) return;
  if (e.key === "Escape") { const i = editing; editing = -1; __log.push("esc cancel"); draw(); document.querySelector("li[data-i='" + i + "'] .edit").focus(); }
  if (e.key === "Enter" && e.target.matches("input")) { e.preventDefault(); document.querySelector("li[data-i='" + editing + "'] .save").click(); }
});
$("when").addEventListener("change", () => { const v = $("when").value; __log.push("date " + v); $("day").textContent = v ? new Date(v + "T12:00").toLocaleDateString("en-US", { weekday: "long" }) : ""; });
</script>
</body></html>
